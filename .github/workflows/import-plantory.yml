name: Import latest Plantory

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-plantory.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the current Plantory site
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://plant-atlas-globe.cgbjwst4bj.chatgpt.site"
          mkdir -p vendor
          files=(
            "index.html"
            "app-v2.js"
            "data-en.js"
            "styles.css"
            "vendor/countries-50m.json"
            "vendor/earth-blue-marble-2k.jpg"
            "vendor/earth-topology-1k.jpg"
            "vendor/globe.gl-LICENSE.txt"
            "vendor/globe.gl.min.js"
            "vendor/three-globe-LICENSE.txt"
            "vendor/topojson-client.min.js"
          )
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location               "${source_url}/${file}"               --output "${file}"
          done

      - name: Commit imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v2.js data-en.js styles.css vendor
          if git diff --cached --quiet; then
            echo "Plantory is already up to date."
            exit 0
          fi
          git commit -m "Import latest Plantory website"
          git push
